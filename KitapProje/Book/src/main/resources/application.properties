spring.application.name=demo 
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

server.port=8080
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

springdoc.swagger-ui.path=/swagger
spring.jpa.open-in-view=false
jwt.secret=${JWT_SECRET}

# Hibernate SQL sorgularını konsola yazdırma
spring.jpa.properties.hibernate.format_sql=true

# Hibernate SQL sorgu loglarını yazdırma
spring.jpa.properties.hibernate.show_sql=true

# SQL parametrelerini de logla
spring.jpa.properties.hibernate.use_sql_comments=true

# Spring Data JPA Repository log seviyesini DEBUG olarak ayarla
logging.level.org.springframework.data.jpa.repository.query=DEBUG
